# Rotación de logs común: cada contenedor conserva como mucho 3 archivos de 10 MB
# (evita que el disco del PC servidor se llene con logs de Docker).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Zona horaria (informes y "mes en curso"). Ajusta si la oficina no está en Colombia.
      TZ: ${TZ:-America/Bogota}
      # Mismas credenciales que "db"; el host es el nombre del servicio, no localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Variables sueltas (fallback): las usa entrypoint.sh para esperar a Postgres
      # con pg_isready, independientemente de que la app se conecte por DATABASE_URL.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      # Orígenes permitidos por CORS (lista separada por comas). En el despliegue
      # normal el frontend es mismo-origen vía Nginx, así que CORS no interviene;
      # esto solo importa si algún cliente llama a la API desde otro origen.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    # Sin "ports": solo accesible dentro de la red de Docker. Nginx es la única
    # puerta de entrada pública (puerto 80).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    # Sin "ports": Nginx hace proxy_pass hacia este contenedor por su puerto 80 interno.
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge
