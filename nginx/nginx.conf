server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # --- Cabeceras de seguridad (se heredan en los location de abajo porque
    #     ninguno define su propio add_header) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # CSP: todo es de mismo origen. 'unsafe-inline' solo para estilos (atributos
    # style= de React); los scripts quedan restringidos a 'self'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # --- API: todo lo que empieza con /api/ va al backend Express ---
    location /api/ {
        proxy_pass http://backend:3000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers que usa la app (JWT y multi-tenant por empresa). Nginx los
        # reenvía por defecto, pero se fijan explícitos para que quede documentado
        # y no se pierdan si alguna vez se agrega otro proxy_set_header encima.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Empresa-Id $http_x_empresa_id;
        proxy_set_header Content-Type $content_type;
    }

    # --- Todo lo demás: se delega al contenedor "frontend" ---
    # El fallback de SPA (rutas de react-router-dom al refrescar) lo resuelve el
    # propio Nginx del contenedor "frontend" (ver frontend/nginx.conf, que ya
    # tiene try_files ... /index.html). Este Nginx principal solo hace de puerta
    # de entrada única en el puerto 80 y reparte tráfico entre frontend y backend.
    location / {
        proxy_pass http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
