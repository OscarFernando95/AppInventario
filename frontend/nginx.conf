server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: si el archivo no existe como estático, se devuelve
    # index.html para que react-router-dom resuelva la ruta en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
