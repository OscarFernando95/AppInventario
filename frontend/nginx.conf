server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre (app.[hash].js, index.[hash].css): el contenido
    # nunca cambia para un mismo nombre, así que se cachean "para siempre".
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html NO se cachea: tras cada deploy referencia chunks nuevos y el
    # navegador debe volver a pedirlo. Sin esto se ven pantallas en blanco o
    # errores "Failed to fetch dynamically imported module" al actualizar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: si el archivo no existe como estático, se devuelve
    # index.html para que react-router-dom resuelva la ruta en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
